name: Week 7 ball physics and live reload

on:
  push:
    branches: [2026]
  pull_request:
    branches: [2026]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Check the shared model, renderers and real file watcher
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run week07/test_examples.py
