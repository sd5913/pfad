name: Weeks 8–12 practical checks

on:
  pull_request:
    branches: ["2026"]
    paths:
      - "week08/**"
      - "week09/**"
      - "week10/**"
      - "week11/**"
      - "week12/**"
      - ".github/workflows/upcoming-practicals.yml"
  push:
    branches: ["2026"]
    paths:
      - "week08/**"
      - "week09/**"
      - "week10/**"
      - "week11/**"
      - "week12/**"
      - ".github/workflows/upcoming-practicals.yml"

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test every available Python companion independently
        shell: bash
        run: |
          set -euo pipefail
          for week in week08 week09 week10 week12; do
            if [ -d "$week" ]; then
              python -B -m unittest discover -s "$week" -p 'test_*.py' -v
            fi
          done
      - name: Test browser mapping when present
        if: ${{ hashFiles('week11/browser/control.test.cjs') != '' }}
        run: node --test week11/browser/control.test.cjs
      - name: Install pinned runner for the optional MCP protocol smoke
        if: ${{ hashFiles('week12/check_mcp.py') != '' }}
        run: python -m pip install uv==0.12.23
      - name: Exercise real local MCP discovery and call
        if: ${{ hashFiles('week12/check_mcp.py') != '' }}
        run: timeout 90s uv run --no-project --python 3.12 week12/check_mcp.py
